{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "StoreSignal production pipeline bootstrap: retained private artifact bucket only.",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "AllowedValues": [
        "production"
      ],
      "Default": "production"
    },
    "ArtifactBucketName": {
      "Type": "String",
      "AllowedPattern": "^storesignal-prod-pipeline-[0-9]{12}-ap-south-2$"
    }
  },
  "Resources": {
    "ArtifactBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketName": {
          "Ref": "ArtifactBucketName"
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              },
              "BucketKeyEnabled": false
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "IgnorePublicAcls": true,
          "BlockPublicPolicy": true,
          "RestrictPublicBuckets": true
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "LifecycleConfiguration": {
          "Rules": [
            {
              "Id": "AbortIncompleteMultipartUploads",
              "Status": "Enabled",
              "AbortIncompleteMultipartUpload": {
                "DaysAfterInitiation": 7
              }
            }
          ]
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "StoreSignal"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "DataClassification",
            "Value": "private"
          }
        ],
        "OwnershipControls": {
          "Rules": [
            {
              "ObjectOwnership": "BucketOwnerEnforced"
            }
          ]
        }
      }
    },
    "ArtifactBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "ArtifactBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyInsecureTransport",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "ArtifactBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${ArtifactBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            },
            {
              "Sid": "DenyIncorrectEncryption",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:PutObject",
              "Resource": {
                "Fn::Sub": "${ArtifactBucket.Arn}/*"
              },
              "Condition": {
                "StringNotEquals": {
                  "s3:x-amz-server-side-encryption": "AES256"
                }
              }
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "ArtifactBucketName": {
      "Value": {
        "Ref": "ArtifactBucket"
      }
    },
    "ArtifactBucketArn": {
      "Value": {
        "Fn::GetAtt": [
          "ArtifactBucket",
          "Arn"
        ]
      }
    }
  }
}
