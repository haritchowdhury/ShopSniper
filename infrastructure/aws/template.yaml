      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Name": "/storesignal/production/aws-pipeline",
        "Description": "Empty G14 secret container; G15 installs the strict pipeline JSON value.",
