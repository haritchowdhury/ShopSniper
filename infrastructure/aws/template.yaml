{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Transform": "AWS::Serverless-2016-10-31",
  "Description": "StoreSignal production Lambda-SQS-S3 pipeline; all sources disabled at G14.",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "AllowedValues": [
        "production"
      ],
      "Default": "production"
    },
    "ArtifactBucketName": {
      "Type": "String",
      "AllowedPattern": "^storesignal-prod-pipeline-[0-9]{12}-ap-south-2$"
    },
    "DiscoveryWorkerCodeKey": {
      "Type": "String",
      "AllowedPattern": "^deployment/[a-f0-9]{64}/discovery-worker\\.zip$"
    },
    "DiscoveryWorkerCodeVersion": {
      "Type": "String",
      "MinLength": 1,
      "MaxLength": 1024
    },
    "DomainAggregatorCodeKey": {
      "Type": "String",
      "AllowedPattern": "^deployment/[a-f0-9]{64}/domain-aggregator\\.zip$"
    },
    "DomainAggregatorCodeVersion": {
      "Type": "String",
      "MinLength": 1,
      "MaxLength": 1024
    },
    "LeadWorkerCodeKey": {
      "Type": "String",
      "AllowedPattern": "^deployment/[a-f0-9]{64}/lead-worker\\.zip$"
    },
    "LeadWorkerCodeVersion": {
      "Type": "String",
      "MinLength": 1,
      "MaxLength": 1024
    },
    "LeadAggregatorCodeKey": {
      "Type": "String",
      "AllowedPattern": "^deployment/[a-f0-9]{64}/lead-aggregator\\.zip$"
    },
    "LeadAggregatorCodeVersion": {
      "Type": "String",
      "MinLength": 1,
      "MaxLength": 1024
    },
    "TrafficWorkerCodeKey": {
      "Type": "String",
      "AllowedPattern": "^deployment/[a-f0-9]{64}/traffic-worker\\.zip$"
    },
    "TrafficWorkerCodeVersion": {
      "Type": "String",
      "MinLength": 1,
      "MaxLength": 1024
    },
    "FinalAggregatorCodeKey": {
      "Type": "String",
      "AllowedPattern": "^deployment/[a-f0-9]{64}/final-aggregator\\.zip$"
    },
    "FinalAggregatorCodeVersion": {
      "Type": "String",
      "MinLength": 1,
      "MaxLength": 1024
    },
    "RecoveryCodeKey": {
      "Type": "String",
      "AllowedPattern": "^deployment/[a-f0-9]{64}/recovery\\.zip$"
    },
    "RecoveryCodeVersion": {
      "Type": "String",
      "MinLength": 1,
      "MaxLength": 1024
    }
  },
  "Resources": {
    "ArtifactBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketName": {
          "Ref": "ArtifactBucketName"
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              },
              "BucketKeyEnabled": false
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "IgnorePublicAcls": true,
          "BlockPublicPolicy": true,
          "RestrictPublicBuckets": true
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "LifecycleConfiguration": {
          "Rules": [
            {
              "Id": "AbortIncompleteMultipartUploads",
              "Status": "Enabled",
              "AbortIncompleteMultipartUpload": {
                "DaysAfterInitiation": 7
              }
            }
          ]
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "StoreSignal"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "DataClassification",
            "Value": "private"
          }
        ],
        "OwnershipControls": {
          "Rules": [
            {
              "ObjectOwnership": "BucketOwnerEnforced"
            }
          ]
        }
      }
    },
    "ArtifactBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "ArtifactBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyInsecureTransport",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "ArtifactBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${ArtifactBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            },
            {
              "Sid": "DenyIncorrectEncryption",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:PutObject",
              "Resource": {
                "Fn::Sub": "${ArtifactBucket.Arn}/*"
              },
              "Condition": {
                "StringNotEquals": {
                  "s3:x-amz-server-side-encryption": "AES256"
                }
              }
            }
          ]
        }
      }
    },
    "DiscoveryDlq": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "QueueName": {
          "Fn::Sub": "${AWS::StackName}-discovery-dlq"
        },
        "MessageRetentionPeriod": 1209600,
        "SqsManagedSseEnabled": true,
        "Tags": [
          {
            "Key": "Project",
            "Value": "StoreSignal"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "QueueRole",
            "Value": "dead-letter"
          }
        ]
      }
    },
    "DiscoveryCheckDlq": {
